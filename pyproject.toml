[project]
name = "model-metamers-pytorch"
version = "0.1.0"
description = "Model metamers analysis and generation workflows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chcochleagram @ git+https://github.com/jenellefeather/chcochleagram.git@731387778e40ee0298fdb13ac72789802f8e3cbb",
    "cox==0.2",
    "dill==0.4.1",
    "gitpython==3.1.46",
    "h5py==3.15.1",
    "huggingface-hub==1.12.0",
    "ipykernel==7.1.0",
    "ipywidgets==8.1.8",
    "jupyterlab==4.5.2",
    "librosa==0.11.0",
    "lightning==2.6.0",
    "matplotlib==3.10.8",
    "numpy==2.3.5",
    "pandas==2.3.3",
    "pillow==12.0.0",
    "pytest==9.0.3",
    "pyyaml==6.0.3",
    "requests==2.32.5",
    "safetensors==0.7.0",
    "scikit-learn==1.8.0",
    "scipy==1.17.0",
    "seaborn==0.13.2",
    "soundfile==0.13.1",
    "tfrecord==1.14.6",
    "timm==1.0.26",
    "tokenizers==0.22.2",
    "torch==2.9.1+cu130",
    "torchaudio==2.9.1+cu130",
    "torchlibrosa==0.1.0",
    "torchmetrics==1.8.2",
    "torchvision==0.24.1+cu130",
    "tqdm==4.67.1",
    "transformers==5.6.2",
    "wandb==0.24.0",
]

[dependency-groups]
dev = [
    "black==25.1.0",
    "ruff==0.15.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchaudio = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]
