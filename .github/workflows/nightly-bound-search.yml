name: Nightly Lipschitz Bound Search

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  propose-next-trial:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: metamMuon
          python-version: "3.12"
          auto-update-conda: true

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          set -euo pipefail
          sed '/^prefix:/d' yml_files_for_dependencies/03_02_2026_environment.yml > /tmp/metamMuon_env.yml
          conda env create -f /tmp/metamMuon_env.yml || true
          pip install "git+https://github.com/jenellefeather/chcochleagram.git" || true
          awk '/^ - pip:$/,0' yml_files_for_dependencies/03_02_2026_environment.yml | tail -n +2 | sed 's/^ - //' | grep -v '^chcochleagram' | grep -v '^prefix:' > /tmp/metamMuon_pip.txt
          pip install -r /tmp/metamMuon_pip.txt --extra-index-url https://download.pytorch.org/whl/cpu || true

      - name: Propose next bound-search trial
        shell: bash -l {0}
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}"
          python scripts/nightly_bound_search.py propose
          python scripts/nightly_bound_search.py status

      - name: Upload morning-ready artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-bound-search-${{ github.run_id }}
          path: |
            experiments/nightly_bound_search/READY_FOR_MORNING.json
            experiments/nightly_bound_search/state.json
            configs/nightly/generated/*.json
          if-no-files-found: warn
